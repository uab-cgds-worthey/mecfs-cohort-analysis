# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: run-lintr

jobs:
  lint-project:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install lintr
        run: install.packages("lintr")
        shell: Rscript {0}

      - name: Lint dge-analysis directory
        run: |
          lint_paths <- c(
            list.files("dge-analysis/analysis", pattern = "\\.[Rr]md$", full.names = TRUE),
            list.files("dge-analysis/code", pattern = "\\.[Rr]$", full.names = TRUE)
          )
          lint_results <- unlist(lapply(lint_paths, lintr::lint), recursive = FALSE)
          print(lint_results)
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: false
