name: Test dge-analysis workflowr on Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "dge-analysis/**"
      - ".github/workflows/test-dge-workflowr-windows.yml"
  pull_request:
    paths:
      - "dge-analysis/**"
      - ".github/workflows/test-dge-workflowr-windows.yml"

jobs:
  test-workflowr:
    runs-on: windows-2022
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: dge-analysis
        shell: Rscript {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Show R session
        run: sessionInfo()

      - name: Install renv
        run: install.packages("renv")

      - name: Restore project library
        run: renv::restore(prompt = FALSE)

      - name: Run workflowr build from README
        run: {
          library(workflowr)
          wflow_build("analysis/*.Rmd")
        }
