name: Test dge-analysis workflowr on Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "dge-analysis/**"
      - ".github/workflows/test-dge-workflowr-windows.yml"
  pull_request:
    paths:
      - "dge-analysis/**"
      - ".github/workflows/test-dge-workflowr-windows.yml"

jobs:
  test-workflowr:
    runs-on: windows-2022
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ${{ github.workspace }}/renv-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: false

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Cache renv library
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ runner.os }}-r-4.5.1-renv-${{ hashFiles('dge-analysis/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-r-4.5.1-renv-

      - name: Show R session
        shell: pwsh
        run: Rscript --vanilla -e "sessionInfo()"

      - name: Install lockfile renv version
        shell: pwsh
        run: >
          Rscript --vanilla -e "install.packages(
          'https://cran.r-project.org/src/contrib/Archive/renv/renv_1.1.4.tar.gz',
          repos = NULL,
          type = 'source'
          )"

      - name: Restore project library
        shell: pwsh
        run: >
          Rscript --vanilla -e "setwd('dge-analysis');
          source('renv/activate.R');
          renv::restore(project = getwd(), prompt = FALSE)"

      - name: Run workflowr build from README
        shell: pwsh
        run: >
          Rscript --vanilla -e "setwd('dge-analysis');
          source('renv/activate.R');
          library(workflowr);
          wflow_build('analysis/*.Rmd')"
